<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پروفایل من</title>
    <link rel="stylesheet" href="assets/css/profile.css">
</head>
<body>
    <nav class="navbar">
        <div class="brand">Sharif Lost&Found</div>
        <a href="index.html" style="font-weight: 600; font-size: 0.9rem;">بازگشت به خانه</a>
    </nav>

    <div class="container">
        <h1 class="page-title">مدیریت حساب کاربری</h1>

        <div class="grid-layout">
            <!-- ستون راست: ویرایش اطلاعات -->
            <div class="sidebar-col">
                <div class="card">
                    <h3 class="section-title">
                        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                        مشخصات فردی
                    </h3>
                    <form id="profile-form">
                        <div class="form-group">
                            <label class="form-label">ایمیل (غیرقابل تغییر)</label>
                            <input type="email" id="profile-email" class="form-input" readonly>
                        </div>
                        <div class="form-group">
                            <label class="form-label">نام</label>
                            <input type="text" id="profile-name" class="form-input" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">نام خانوادگی</label>
                            <input type="text" id="profile-family" class="form-input" required>
                        </div>
                        <button type="submit" class="btn btn-primary">ذخیره تغییرات</button>
                    </form>
                </div>

                <div class="card">
                    <h3 class="section-title">
                        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                        تغییر رمز عبور
                    </h3>
                    <form id="password-form">
                        <div class="form-group">
                            <label class="form-label">رمز عبور فعلی</label>
                            <input type="password" id="old-pass" class="form-input" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">رمز عبور جدید</label>
                            <input type="password" id="new-pass" class="form-input" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">تکرار رمز جدید</label>
                            <input type="password" id="confirm-pass" class="form-input" required>
                        </div>
                        <button type="submit" class="btn btn-primary">بروزرسانی رمز</button>
                    </form>
                </div>
            </div>

            <!-- ستون چپ: آمار و لیست -->
            <div class="main-col">
                <div class="stats-grid">
                    <div class="stat-box">
                        <span class="stat-value" id="stat-total">0</span>
                        <span class="stat-label">کل آگهی‌ها</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-value" id="stat-active">0</span>
                        <span class="stat-label">فعال</span>
                    </div>
                </div>

                <div class="card">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                        <h3 class="section-title" style="margin:0;">آگهی‌های من</h3>
                        <select id="items-filter" class="form-input" style="width:150px;" onchange="loadUserItems()">
                            <option value="ALL">همه</option>
                            <option value="LOST">گمشده</option>
                            <option value="FOUND">پیدا شده</option>
                        </select>
                    </div>

                    <div class="table-container">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>عنوان</th>
                                    <th>نوع</th>
                                    <th>تاریخ ثبت</th>
                                    <th>عملیات</th>
                                </tr>
                            </thead>
                            <tbody id="items-table-body">
                                <!-- سطرها توسط JS پر می‌شوند -->
                            </tbody>
                        </table>
                        <div id="empty-state" style="text-align:center; padding:30px; display:none; color:var(--text-muted);">
                            هنوز هیچ آگهی ثبت نکرده‌اید.
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/profile.js"></script>
</body>
</html>
