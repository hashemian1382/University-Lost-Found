<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شریف - اشیای گمشده</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="assets/css/index-modern.css">
</head>
<body>
    <nav class="navbar">
        <div class="brand">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                <circle cx="12" cy="10" r="3"></circle>
            </svg>
            Sharif Lost&Found
        </div>
        <div class="nav-actions">
            <div id="auth-links">
                <a href="login.html" class="btn btn-outline">ورود به حساب</a>
                <a href="signup.html" class="btn btn-primary">ثبت نام</a>
            </div>
            <div id="user-links" class="hidden">
                <a href="create-item.html" class="btn btn-primary">ثبت آگهی جدید +</a>
                <button onclick="logout()" class="btn btn-outline">خروج</button>
            </div>
        </div>
    </nav>

    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="search-container">
                    <input type="text" id="search-input" class="search-input" placeholder="جستجو در بین آگهی‌ها...">
                    <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </div>

                <div class="filter-grid">
                    <select id="tag-filter" class="filter-select" onchange="app.updateFilter('tag', this.value)">
                        <option value="">همه دسته‌بندی‌ها</option>
                    </select>
                    
                    <select id="sort-filter" class="filter-select" onchange="app.updateFilter('sort', this.value)">
                        <option value="newest">جدیدترین</option>
                        <option value="oldest">قدیمی‌ترین</option>
                    </select>
                </div>

                <div class="tabs">
                    <div class="tab active" onclick="app.updateFilter('type', 'ALL')">همه آگهی‌ها</div>
                    <div class="tab" onclick="app.updateFilter('type', 'LOST')">گمشده‌ها</div>
                    <div class="tab" onclick="app.updateFilter('type', 'FOUND')">پیداشده‌ها</div>
                </div>
            </div>

            <div id="items-list" class="items-list"></div>
        </aside>

        <main class="map-area">
            <div id="map"></div>
        </main>
    </div>

    <!-- Modal (Popup) -->
    <div id="item-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title" id="modal-title"></h3>
                <button class="close-btn" onclick="app.closeModal()">×</button>
            </div>
            <div class="modal-body">
                <img id="modal-image" src="" style="width:100%; height:250px; object-fit:cover; border-radius:12px; margin-bottom:24px; background:#f3f4f6;">
                
                <div class="modal-detail-row">
                    <div class="detail-item">
                        <span class="detail-label">ثبت کننده</span>
                        <span class="detail-value" id="modal-user"></span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">تاریخ ثبت</span>
                        <span class="detail-value" id="modal-date"></span>
                    </div>
                    <div class="detail-item">
                        <span class="detail-label">وضعیت</span>
                        <span class="detail-value" id="modal-status"></span>
                    </div>
                </div>

                <p id="modal-desc" class="modal-desc"></p>
                <div id="modal-tags" style="display:flex; gap:8px;"></div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/index-app.js"></script>
</body>
</html>
