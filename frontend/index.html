<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شریف - اشیای گمشده</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="assets/css/index-modern.css">
</head>
<body>
    <nav class="navbar">
        <div class="brand">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                <circle cx="12" cy="10" r="3"></circle>
            </svg>
            Sharif Lost&Found
        </div>
        <div class="nav-actions">
            <div id="auth-links">
                <a href="login.html" class="btn btn-outline">ورود به حساب</a>
                <a href="signup.html" class="btn btn-primary">ثبت نام</a>
            </div>
            <div id="user-links" class="hidden" style="display: flex; align-items: center; gap: 10px;">
                <a href="create-item.html" class="btn btn-primary">ثبت آگهی جدید +</a>
                
                <a href="chatbot.html" class="btn btn-outline" style="display: flex; align-items: center; gap: 6px;" title="AI Chatbot">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                    </svg>
                    AI Assistant
                </a>
                
                <a href="profile.html" class="btn btn-outline" style="padding: 8px 12px; border-radius: 50%; width: 42px; height: 42px; display: flex; align-items: center; justify-content: center;" title="پروفایل من">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                </a>

                <button onclick="logout()" class="btn btn-outline" style="padding: 10px;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                </button>
            </div>
        </div>
    </nav>

    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="search-container">
                    <input type="text" id="search-input" class="search-input" placeholder="جستجو در بین آگهی‌ها...">
                    <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </div>
                
                <!-- نوار ابزار جدید: شامل مرتب‌سازی و تگ‌ها -->
                <div class="filter-toolbar">
                    <!-- بخش مرتب‌سازی (ثابت) -->
                    <div class="sort-section">
                        <svg class="sort-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="21" y1="10" x2="3" y2="10"></line>
                            <line x1="21" y1="6" x2="3" y2="6"></line>
                            <line x1="21" y1="14" x2="3" y2="14"></line>
                            <line x1="21" y1="18" x2="3" y2="18"></line>
                        </svg>
                        <select id="sort-filter" class="sort-select" onchange="app.updateFilter('sort', this.value)">
                            <option value="newest">جدیدترین</option>
                            <option value="oldest">قدیمی‌ترین</option>
                        </select>
                    </div>

                    <div class="vertical-divider"></div>

                    <!-- بخش تگ‌ها (اسکرول شونده) -->
                    <div class="tags-wrapper-outer">
                        <div id="tags-scroll-container" class="tags-scroll-container">
                            <!-- تگ‌ها توسط JS اینجا قرار می‌گیرند -->
                        </div>
                    </div>
                </div>

                <div class="tabs">
                    <div class="tab active" onclick="app.updateFilter('type', 'ALL')">همه آگهی‌ها</div>
                    <div class="tab" onclick="app.updateFilter('type', 'LOST')">گمشده‌ها</div>
                    <div class="tab" onclick="app.updateFilter('type', 'FOUND')">پیداشده‌ها</div>
                </div>
            </div>
            <div id="items-list" class="items-list"></div>
        </aside>
        <main class="map-area">
            <div id="map"></div>
            <button id="locate-btn-index" class="geo-btn" title="مکان فعلی من">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="22" y1="12" x2="18" y2="12"></line>
                    <line x1="6" y1="12" x2="2" y2="12"></line>
                    <line x1="12" y1="6" x2="12" y2="2"></line>
                    <line x1="12" y1="22" x2="12" y2="18"></line>
                </svg>
            </button>
        </main>
    </div>

    <div id="item-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title" id="modal-title"></h3>
                <button class="close-btn" onclick="app.closeModal()">×</button>
            </div>
            <div class="modal-body">
                <img id="modal-image" src="" style="width:100%; height:250px; object-fit:cover; border-radius:12px; margin-bottom:24px; background:#f3f4f6;">
                <div class="modal-detail-row">
                    <div class="detail-item"><span class="detail-label">ثبت کننده</span><span class="detail-value" id="modal-user"></span></div>
                    <div class="detail-item"><span class="detail-label">تاریخ ثبت</span><span class="detail-value" id="modal-date"></span></div>
                    <div class="detail-item"><span class="detail-label">وضعیت</span><span class="detail-value" id="modal-status"></span></div>
                </div>
                <p id="modal-desc" class="modal-desc"></p>
                <div id="modal-tags" style="display:flex; gap:8px;"></div>
            </div>
            <div class="modal-footer" style="margin-top: 24px; padding-top: 20px; border-top: 1px solid #e5e7eb;">
                <button id="modal-details-btn" class="btn btn-primary" style="width: 100%; padding: 12px; font-size: 1rem;">
                    مشاهده جزئیات کامل و گفتگو
                </button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/index-app.js"></script>
</body>
</html>
