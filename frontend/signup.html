<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثبت نام در سامانه</title>
    <link rel="stylesheet" href="assets/css/auth-modern.css">
</head>
<body>
    <div class="background-shape shape-1"></div>
    <div class="background-shape shape-2"></div>

    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="brand-logo">Sharif Lost&Found</div>
            <h1 class="auth-title">ساخت حساب جدید</h1>
            <p class="auth-subtitle">به جامعه دانشگاه شریف بپیوندید</p>

            <form id="otp-step-1" class="fade-in">
                <div class="input-group">
                    <input type="email" id="signup-email" class="form-input" placeholder="ایمیل دانشگاهی (example@sharif.edu)" required>
                    <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                        <polyline points="22,6 12,13 2,6"></polyline>
                    </svg>
                </div>
                <button type="submit" class="submit-btn">دریافت کد تایید</button>
            </form>

            <form id="otp-step-2" class="hidden fade-in">
                <div class="input-group">
                    <input type="text" id="otp-code" class="form-input" placeholder="کد 6 رقمی ارسال شده" required autocomplete="off">
                    <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                        <circle cx="12" cy="10" r="3"></circle>
                    </svg>
                </div>
                
                <div style="display: flex; gap: 10px;">
                    <div class="input-group" style="flex: 1;">
                        <input type="text" id="first-name" class="form-input" placeholder="نام" required>
                    </div>
                    <div class="input-group" style="flex: 1;">
                        <input type="text" id="last-name" class="form-input" placeholder="نام خانوادگی" required>
                    </div>
                </div>

                <div class="input-group" style="margin-bottom: 5px;">
                    <input type="password" id="signup-password" class="form-input" placeholder="رمز عبور دلخواه" required>
                    <svg class="input-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                </div>
                <small style="color: #666; font-size: 0.75rem; display: block; margin-bottom: 15px;">
                    رمز باید حداقل ۸ کاراکتر و شامل حروف بزرگ، کوچک و عدد باشد.
                </small>
                
                <button type="submit" class="submit-btn">تکمیل ثبت نام</button>
            </form>

            <div class="auth-footer">
                قبلاً ثبت نام کرده‌اید؟ <a href="login.html" class="auth-link">وارد شوید</a>
                <br>
                <a href="index.html" class="back-home">
                    بازگشت به صفحه اصلی
                </a>
            </div>
        </div>
    </div>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth.js"></script>
</body>
</html>
