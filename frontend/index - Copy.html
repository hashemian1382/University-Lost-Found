<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>گمشدگان شریف</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">Sharif Lost&Found</div>
        <div class="nav-links">
            <div id="auth-links">
                <a href="login.html" class="btn btn-outline">ورود</a>
                <a href="signup.html" class="btn btn-primary">ثبت نام</a>
            </div>
            <div id="user-links" class="hidden">
                <a href="create-item.html" class="btn btn-primary">➕ ثبت آگهی</a>
                <button onclick="logout()" class="btn btn-outline">خروج</button>
            </div>
        </div>
    </nav>

    <div class="main-layout">
        <!-- لیست آیتم‌ها -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <input type="text" id="search-input" class="search-box" placeholder="جستجو...">
                <div class="filter-tabs">
                    <div class="tab active" onclick="filterItems('ALL')">همه</div>
                    <div class="tab" onclick="filterItems('LOST')">گمشده</div>
                    <div class="tab" onclick="filterItems('FOUND')">پیداشده</div>
                </div>
            </div>
            <div id="items-list" class="items-container">
                <!-- اینجا پر می‌شود -->
            </div>
        </aside>

        <!-- نقشه -->
        <main class="map-wrapper">
            <div id="map"></div>
        </main>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>
