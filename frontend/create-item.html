<!-- frontend/create-item.html -->
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثبت آگهی جدید</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .geo-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            width: 40px;
            height: 40px;
            background: white;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            cursor: pointer;
            border: 1px solid #ccc;
            transition: all 0.2s;
        }
        .geo-btn:hover {
            background: #f0f0f0;
        }
        
        /* استایل‌های جدید برای انتخاب تگ مدرن */
        .tags-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 5px 0;
            min-height: 42px;
        }
        
        .tag-chip {
            background-color: #f3f4f6;
            border: 1px solid #e5e7eb;
            color: #374151;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
            display: inline-flex;
            align-items: center;
        }
        
        .tag-chip:hover {
            background-color: #e5e7eb;
        }
        
        .tag-chip.active {
            background-color: #3b82f6;
            color: white;
            border-color: #2563eb;
            box-shadow: 0 2px 4px rgba(59, 130, 246, 0.3);
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">Sharif Lost&Found</div>
        <div class="nav-links">
            <a href="index.html" class="btn btn-outline">بازگشت</a>
        </div>
    </nav>

    <div class="form-page">
        <div class="form-card">
            <h2 style="text-align:center; margin-bottom:20px;" id="form-title">ثبت آگهی جدید</h2>
            
            <form id="create-item-form">
                <div class="form-group">
                    <label class="form-label">عنوان</label>
                    <input type="text" name="title" class="form-input" required placeholder="مثال: کیف پول">
                </div>

                <div class="form-group" style="display:flex; gap:10px;">
                    <div style="flex:1">
                        <label class="form-label">نوع</label>
                        <select name="type" class="form-select">
                            <option value="LOST">گمشده</option>
                            <option value="FOUND">پیدا شده</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">دسته‌بندی‌ها</label>
                    <div id="tags-container" class="tags-wrapper">
                        <span style="font-size:0.8rem; color:#9ca3af;">در حال بارگذاری تگ‌ها...</span>
                    </div>
                    <!-- تگ سلکت مخفی برای ارسال استاندارد فرم -->
                    <select name="tags" id="hidden-tag-select" multiple style="display:none;"></select>
                </div>

                <div class="form-group">
                    <label class="form-label">توضیحات</label>
                    <textarea name="description" class="form-textarea"></textarea>
                </div>
                
                <div class="form-group">
                    <label class="form-label">تصویر</label>
                    <input type="file" name="image" class="form-input" accept="image/*">
                </div>

                <div class="form-group">
                    <label class="form-label">موقعیت روی نقشه (الزامی)</label>
                    <div style="position: relative;">
                        <div id="form-map" style="height: 300px; width:100%; border-radius:8px; border:1px solid #ddd;"></div>
                        <button type="button" id="locate-btn" class="geo-btn" title="مکان فعلی من">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="10"></circle>
                                <line x1="22" y1="12" x2="18" y2="12"></line>
                                <line x1="6" y1="12" x2="2" y2="12"></line>
                                <line x1="12" y1="6" x2="12" y2="2"></line>
                                <line x1="12" y1="22" x2="12" y2="18"></line>
                            </svg>
                        </button>
                    </div>
                    <input type="hidden" name="latitude" id="lat">
                    <input type="hidden" name="longitude" id="lng">
                </div>

                <button type="submit" class="btn btn-primary" style="width:100%; padding:12px;">ثبت آگهی</button>
            </form>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>
